name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)

          if [[ -z "$last_tag" ]]; then
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normalize tags like v1.4 to 1.4.0.
          IFS=. read -r major minor patch <<< "${last_tag#v}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          messages=$(git log "$last_tag"..HEAD --format=%B)
          if [[ -z "$messages" ]]; then
            echo "No new commits since $last_tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE' <<< "$messages"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\(.+\))?:' <<< "$messages"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          echo "Previous: $last_tag -> next: $major.$minor.$patch"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Update README versions
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          find . -name README.md -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*\")[0-9]+\.[0-9]+\.[0-9]+(\")/\1${VERSION}\2/"

          if git diff --quiet; then
            echo "READMEs already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: bump module version to ${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest
